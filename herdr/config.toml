onboarding = false
[keys]
prefix = "ctrl+a"
new_tab = ["prefix+c", "alt+o"]
switch_tab = ["prefix+1..9", "alt+1..9"]
next_workspace = "alt+n"
previous_workspace = "alt+p"
next_agent = "alt+shift+n"
previous_agent = "alt+shift+p"
rename_tab = "prefix+r"
resize_mode = ""

[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[theme.custom]
panel_bg = "reset"

[ui]
host_cursor = "native"
hide_tab_bar_when_single_tab = true
pane_gaps = true
pane_borders = "always"

[ui.sound]
enabled = false
