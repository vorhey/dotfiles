# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Session management
bind-key s choose-tree -Zs -O none
bind-key k confirm-before -p "Kill session #S (y/n)?" "switch-client -n \; kill-session -t '#S'"
bind-key t command-prompt -p "New Session Name:" "new-session -s '%%'"

# Terminal settings
set -g default-terminal "tmux-256color"
set-option -g default-shell /bin/zsh
set-option -sa terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-overrides ",tmux-256color:RGB"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment TERM_COLOR

# Performance and responsiveness
set-option -sg escape-time 10
set-option -g focus-events on

# UI behavior
set -g mouse on
set -g allow-passthrough on
set -g visual-activity off

# Kitty keyboard protocol passthrough (needed for Shift+Enter etc. in Ghostty)
set -as terminal-features ',*ghostty*:extkeys'
set -g extended-keys on
%if #{>=:#{version},3.7}
set -g extended-keys-format csi-u
%endif

# Clipboard
set -g set-clipboard on

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Window management
bind-key -n M-o new-window -c "#{pane_current_path}"
bind-key r command-prompt -I "#W" "rename-window '%%'"
set -g base-index 1
set-option -g renumber-windows on

# Window navigation
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Session navigation
bind-key -n M-n switch-client -n
bind-key -n M-p switch-client -p

# Window swapping
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Pane navigation
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-Right select-pane -R
bind-key -n M-H select-pane -L
bind-key -n M-L select-pane -R

# Pane splitting
bind-key v split-window -h -c "#{pane_current_path}"
bind-key x split-window -v -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Status bar configuration
set-option -g status-position top
set-option -g status-style bg=default

# Theme - picked per client, so a light and a dark terminal can share a session.
# @light_clients lists the clients on a light terminal (kept by tmux-theme.sh);
# each colour is resolved against it when a client's status line is drawn.
# Light: tokyonight-day, dark: tokyonight-night
set -g @light '#{m:*<#{client_name}>*,#{@light_clients}}'
set -g @thm_fg '#{?#{E:@light},#9699a3,#a9b1d6}'
set -g @thm_accent '#{?#{E:@light},#3760bf,#7aa2f7}'
set -g @thm_pill '#{?#{E:@light},#e1e2e7,#1a1b26}'
set -g @thm_sep '#{?#{E:@light},#b6bac9,#565f89}'
set -g @thm_session '#{?#{E:@light},#3760bf,#c0caf5}'
set -g @thm_branch '#{?#{E:@light},#9854f1,#bb9af7}'

# On attach, take the theme from the attaching shell's TERM_COLOR, which .zshrc
# detects from the terminal background (OSC 11)
set-hook -g client-attached {
    run-shell '~/dotfiles/tmux-theme.sh "$TERM_COLOR" "#{hook_client}"'
}
# (new-session doesn't fire client-attached)
set-hook -g session-created {
    if-shell -F '#{session_attached}' {
        run-shell '~/dotfiles/tmux-theme.sh "$TERM_COLOR" "#{client_name}"'
    }
}

# Terminals that report theme changes (mode 2031) switch live
%if #{>=:#{version},3.6}
set-hook -g client-dark-theme {
    run-shell '~/dotfiles/tmux-theme.sh dark "#{hook_client}"'
}
set-hook -g client-light-theme {
    run-shell '~/dotfiles/tmux-theme.sh light "#{hook_client}"'
}
%endif

# Window status format
set -g @tab_label '#I#(~/dotfiles/get_process_icon.sh #{pane_current_command}) #(~/dotfiles/get_window_name.sh "#W") #(~/dotfiles/get_project_root.sh #{pane_current_path})'
set-window-option -g window-status-format '#[fg=#{E:@thm_fg}]#{E:@tab_label}'
set-window-option -g window-status-current-style 'default'
# Alert styles otherwise reverse the blank rows around inactive tabs.
set-window-option -g window-status-activity-style 'default'
set-window-option -g window-status-bell-style 'default'
set-window-option -g window-status-current-format '#[fg=#{E:@thm_accent},bg=default]│#[bold] #{E:@tab_label} #[nobold]│#[default]'

# Window separator
set-window-option -g window-status-separator '#[fg=#{E:@thm_sep}] ⋮ '

set-option -g status-left ""
set-option -g status-right-length 200

# Status right
set-option -g status-right '#{?session_attached,#[fg=#{E:@thm_session}],#[fg=#{E:@thm_fg}]} 󰣘 #S #[fg=#{E:@thm_fg}][#(tmux list-sessions | grep -n "^$(tmux display-message -p "#S"):.*" | cut -d: -f1)/#(tmux list-sessions | wc -l)] #[fg=#{E:@thm_branch}] #(cd #{pane_current_path}; git branch --show-current 2>/dev/null)'

# Rounded active tab: use real box-drawing characters on three status rows.
# All rows share the default layout so scrolling and mouse targets stay aligned.
set -g status 3
set -gu status-format
set -gF @tab_base_row '#{status-format[0]}'
set -g @tab_blank '#{R: ,#{E;w:@tab_label}}'
set -g @tab_top '#[fg=#{E:@thm_accent}]╭─#{R:─,#{E;w:@tab_label}}─╮#[default]'
set -g @tab_bottom '#[fg=#{E:@thm_accent}]╰─#{R:─,#{E;w:@tab_label}}─╯#[default]'
set -g @tab_gap '#{R: ,#{E;w:window-status-separator}}'
set -g @tab_right_blank '#{R: ,#{E;w:status-right}}'
set -gF @tab_top_row '#{s|window-status-current-format|@tab_top|;s|window-status-format|@tab_blank|;s|window-status-separator|@tab_gap|;s|status-right([^a-z-])|@tab_right_blank\1|:@tab_base_row}'
set -gF @tab_bottom_row '#{s|window-status-current-format|@tab_bottom|;s|window-status-format|@tab_blank|;s|window-status-separator|@tab_gap|;s|status-right([^a-z-])|@tab_right_blank\1|:@tab_base_row}'
set -g status-format[0] '#{E:@tab_top_row}'
set -g status-format[1] '#{E:@tab_base_row}'
set -g status-format[2] '#{E:@tab_bottom_row}'

bind-key g run-shell "$HOME/dotfiles/tmux-grid.sh"

# Vim mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi V send-keys -X select-line
